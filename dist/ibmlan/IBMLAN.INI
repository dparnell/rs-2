; IBMLAN.INI: the LAN requester's settings (docs/LAN.md).
; NET START REQUESTER reads [requester]; switches given to it
; (/COMPUTERNAME:name, /DOMAIN:name) take precedence.

[requester]
  computername = RS2
  domain = WORKGROUP
  othdomains =
; rs2 additions: a WINS server for NetBIOS names (address[:port]),
; the LMHOSTS file (default %ETC%\LMHOSTS), and the SMB ports.
  wins =
  smbport = 445
  nbport = 139
