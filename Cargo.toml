[workspace]
resolver = "3"
members = ["crates/*", "boot", "kernel", "tools/lxdump", "xtask"]
# boot and kernel are cross-compiled by xtask.
default-members = ["crates/os2-exe", "crates/bootinfo", "crates/fat", "tools/lxdump", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
