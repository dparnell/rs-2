[workspace]
resolver = "3"
members = ["crates/*", "boot", "kernel", "tools/lxdump", "tools/elf2lx", "tools/unpack", "tools/dosrun", "tools/mkmsgf", "xtask"]
# boot and kernel are cross-compiled by xtask.
default-members = ["crates/x86emu", "crates/dos", "crates/win16drv", "crates/os2-exe", "crates/bootinfo", "crates/fat", "crates/gpi", "crates/hpfs", "crates/jfs", "crates/inifile", "crates/ipf", "crates/mci", "crates/msgf", "crates/midi", "crates/mmfmt", "crates/mmimage", "crates/mmavi", "crates/os2-pack", "crates/os2-backup", "crates/lvm", "crates/pmwin", "crates/tcpip", "crates/uls", "crates/viocell", "crates/vt100", "tools/lxdump", "tools/elf2lx", "tools/unpack", "tools/dosrun", "tools/mkmsgf", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
