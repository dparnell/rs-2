[package]
name = "rs2libc"
description = "The C library subset Rust's std (i686-unknown-linux-gnu) needs, on top of the OS/2 API"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
libc = { version = "0.2", default-features = false }
libm = "0.2"
dlmalloc = { version = "0.2", default-features = false }
unwinding = { version = "0.2", default-features = false, features = ["unwinder", "dwarf-expr", "hide-trace", "fde-gnu-eh-frame-hdr"] }
