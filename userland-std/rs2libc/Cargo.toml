[package]
name = "rs2libc"
description = "The C library subset Rust's std (i686-unknown-linux-gnu) needs, on top of the OS/2 API"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
libc = { version = "0.2", default-features = false }
libm = "0.2"
dlmalloc = { version = "0.2", default-features = false }
unwinding = { version = "0.2", default-features = false, features = ["unwinder", "dwarf-expr", "hide-trace"] }

# One module there, several here (frames.rs).
[target.'cfg(target_arch = "x86")'.dependencies]
unwinding = { version = "0.2", default-features = false, features = ["fde-gnu-eh-frame-hdr"] }
[target.'cfg(target_arch = "x86_64")'.dependencies]
unwinding = { version = "0.2", default-features = false, features = ["fde-custom"] }
