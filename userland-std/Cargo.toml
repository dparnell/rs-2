# OS/2 programs written in Rust with the standard library. Built for
# i686-unknown-linux-gnu against rs2's own C library (rs2libc: the POSIX
# subset std uses, on top of the OS/2 API) and converted to LX by
# tools/elf2lx. See docs/BROWSER.md. Built for x86_64-unknown-linux-gnu they
# are 64-bit OS/2 programs as they are: docs/STD64.md.
[workspace]
resolver = "3"
members = ["rs2libc", "stdtest", "webcore", "webtext", "web", "webshot", "webjs", "pmstd64", "stdtdll", "stdtrlib", "stdtrust", "rs2ld", "rc64"]
# pmstd64, stdtdll, stdtrlib, stdtrust, rs2ld and rc64 are 64-bit (--target x86_64-unknown-linux-gnu).
# webshot is a host tool (cargo run -p webshot --target aarch64-apple-darwin).
default-members = ["rs2libc", "stdtest", "webcore", "webtext", "web"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
debug = false
