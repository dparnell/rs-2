# OS/2 programs written in Rust with the standard library. Built for
# i686-unknown-linux-gnu against rs2's own C library (rs2libc: the POSIX
# subset std uses, on top of the OS/2 API) and converted to LX by
# tools/elf2lx. See docs/BROWSER.md.
[workspace]
resolver = "3"
members = ["rs2libc", "stdtest"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
debug = false
