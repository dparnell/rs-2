[package]
name = "webcore"
description = "The web engine of rs2's browsers: URLs, HTTP/1.1 over TCP and TLS (rustls), HTML parsing (html5ever) into a DOM"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"
html5ever = "0.40"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
