# OS/2 programs written in Rust. Built for i686 and converted to LX by
# tools/elf2lx (cargo xtask builds them).
[workspace]
resolver = "3"
members = ["os2", "apitest", "testdll", "cmd", "utils", "install", "pmwin", "pmgpi", "pmsrv", "pmhang", "gpitest", "pmctls", "helpmgr", "stress", "nettest", "tcpipcore", "tcpip32", "tnls32", "pmshapi", "so32dll", "tcp32dll", "thunk16", "tcpipdll", "tnls16", "pmdrag", "pmmerge", "libuni", "ctltest", "pmviowin", "nbtest"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "s"
