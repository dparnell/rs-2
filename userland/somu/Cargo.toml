[package]
name = "somu-dll"
description = "SOMU.DLL: SOM 2.1's utility classes and metaclasses (SOMMBeforeAfter, SOMMTraced, SOMMSingleInstance, SOMUTStringId, SOMBuf, ...) as in OS/2 Warp 4"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "somu"
path = "src/lib.rs"

[dependencies]
os2 = { path = "../os2" }
somsup = { path = "../somsup" }
