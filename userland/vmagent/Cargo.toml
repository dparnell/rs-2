[package]
name = "vmagent"
description = "VMAGENT.EXE (the clipboard shared with the hypervisor's host: SPICE agent, VMware, VirtualBox) and QEMUGA.EXE (the QEMU guest agent)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "vmagent"
path = "src/main.rs"

[[bin]]
name = "qemuga"
path = "src/qemuga.rs"

[dependencies]
os2 = { path = "../os2" }
pmkit = { path = "../pmkit" }
guestagent = { path = "../../crates/guestagent" }
