# Build the developer disk (docs/DEVDISK.md): an optional CD image with the
# compilers that run on rs2 (clang, lld, rustc, cargo), samples, rs2's
# sources and an installer. Kept for two weeks as the run's artifact
# "rs2-dev".
#
# The compilers are cross-built from LLVM's and Rust's sources, which takes
# hours, so this is not part of build-iso.yml: it runs when main changes,
# by hand, and for a release (release-iso.yml calls it). Their results are
# cached by what goes into them, and the C++ objects by ccache.
name: Build developer disk

on:
  push:
    branches: [main, devdisk]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: What to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: devdisk-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CLANG: clang-19
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content

jobs:
  # clang, lld and llvm-ar for rs2 (userland64/llvm), and rustc with its own
  # LLVM and cargo (userland64/rustc, userland64/cargo).
  compilers:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [llvm, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - id: key
        run: |
          {
            echo "llvm=${{ hashFiles('userland64/llvm/**', 'userland64/cmake/**', 'userland64/c/cc64.sh', 'userland64/libc/**', 'userland64/include/**', 'userland64/cxx/**', 'userland64/link64.ld', 'tools/cc64/**') }}"
            echo "rust=${{ hashFiles('userland64/rustc/**', 'userland64/cargo/**', 'userland64/cmake/**', 'userland64/c/cc64.sh', 'userland64/libc/**', 'userland64/include/**', 'userland64/cxx/**', 'userland64/link64.ld', 'tools/cc64/**', 'userland-std/*.sh', 'userland-std/*.rs', 'userland-std/link64.ld', 'userland-std/.cargo/**', 'userland-std/include/**', 'userland-std/syslib/**', 'userland-std/rs2libc/**', 'userland64/os2/**') }}"
          } >> "$GITHUB_OUTPUT"

      - id: built
        uses: actions/cache@v5
        with:
          path: |
            target/llvm64
            target/rustc64
            target/cargo64
          key: devdisk-${{ matrix.part }}-${{ steps.key.outputs[matrix.part] }}

      - name: Room on the disk
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      # rustc for rs2 uses the very std of the installed rustc: its version.
      - name: Install Rust
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          v=$(sed -n 's/^ver=//p' userland64/rustc/build.sh)
          rustup toolchain install "$v" --profile minimal \
            --target x86_64-unknown-none,x86_64-unknown-linux-gnu --component llvm-tools
          rustup default "$v"

      - name: Install clang, CMake, Ninja and ccache
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-19 cmake ninja-build ccache
          # (The CMake toolchain file wants one program's name.)
          mkdir -p ~/ccache-bin
          for c in cc c++ gcc g++ clang-19; do ln -sf "$(command -v ccache)" ~/ccache-bin/$c; done
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v5
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: ~/.ccache
          key: devdisk-ccache-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: devdisk-ccache-${{ matrix.part }}-

      - name: Build clang and lld
        if: matrix.part == 'llvm' && steps.built.outputs.cache-hit != 'true'
        run: userland64/llvm/build.sh

      - name: Build rustc and cargo
        if: matrix.part == 'rust' && steps.built.outputs.cache-hit != 'true'
        run: |
          userland64/rustc/build.sh
          userland64/cargo/build.sh

      # Also after a failure: the next run goes on from there.
      - uses: actions/cache/save@v5
        if: always() && steps.built.outputs.cache-hit != 'true'
        with:
          path: ~/.ccache
          key: devdisk-ccache-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v7
        with:
          name: devdisk-${{ matrix.part }}
          path: |
            target/llvm64
            target/rustc64
            target/cargo64
          if-no-files-found: error
          retention-days: 1

  disk:
    needs: compilers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: devdisk-*
          merge-multiple: true
          path: target

      - name: Install Rust
        run: |
          v=$(sed -n 's/^ver=//p' userland64/rustc/build.sh)
          rustup toolchain install "$v" --profile minimal \
            --target x86_64-unknown-uefi,x86_64-unknown-none,i686-unknown-linux-gnu,x86_64-unknown-linux-gnu \
            --component llvm-tools
          rustup default "$v"

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang clang-19

      - name: Build the developer disk
        run: userland64/devdisk/build.sh rs2-dev.iso

      - name: Checksum
        run: sha256sum rs2-dev.iso | tee rs2-dev.iso.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: rs2-dev
          path: |
            rs2-dev.iso
            rs2-dev.iso.sha256
          if-no-files-found: error
          retention-days: 14
