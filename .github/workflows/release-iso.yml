# On a pushed tag (v*): create the GitHub release for it (if there is none
# yet), build the live ISO (rs2's own files only, from dist/manifest.txt)
# and attach it to the release as rs2-live.iso, with its SHA-256.
#
# A release made by hand in GitHub's web page for a new tag creates that
# tag, which also starts this workflow: the release is then kept as it is
# and only gets the ISO.
name: Release ISO

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (its release is created if missing)
        required: true

permissions:
  contents: write

concurrency:
  group: release-iso-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  iso:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Create the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --verify-tag --title "rs2 $TAG" --generate-notes
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target x86_64-unknown-uefi,x86_64-unknown-none,i686-unknown-linux-gnu \
            --component llvm-tools
          rustup default stable

      # userland-std compiles ring's C code with clang (userland-std/cc.sh).
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            userland -> target
            userland-std -> target

      - name: Build the live ISO
        run: cargo xtask iso --dist --release -o rs2-live.iso

      - name: Checksum
        run: sha256sum rs2-live.iso > rs2-live.iso.sha256

      - name: Attach to the release
        run: gh release upload "$TAG" rs2-live.iso rs2-live.iso.sha256 --clobber
