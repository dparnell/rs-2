# Builds the live ISO (rs2's own files only, from dist/manifest.txt) and
# attaches it to the release as rs2-live.iso, with its SHA-256.
name: Release ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the ISO to
        required: true

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target x86_64-unknown-uefi,x86_64-unknown-none,i686-unknown-linux-gnu \
            --component llvm-tools
          rustup default stable

      # userland-std compiles ring's C code with clang (userland-std/cc.sh).
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            userland -> target
            userland-std -> target

      - name: Build the live ISO
        run: cargo xtask iso --dist --release -o rs2-live.iso

      - name: Checksum
        run: sha256sum rs2-live.iso > rs2-live.iso.sha256

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" rs2-live.iso rs2-live.iso.sha256 --clobber
