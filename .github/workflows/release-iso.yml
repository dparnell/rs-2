# On a pushed tag (v*): create the GitHub release for it (if there is none
# yet), build the live ISO (build-iso.yml) and attach it to the release as
# rs2-live.iso, with its SHA-256.
#
# A release made by hand in GitHub's web page for a new tag creates that
# tag, which also starts this workflow: the release is then kept as it is
# and only gets the ISO.
name: Release ISO

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (its release is created if missing)
        required: true

permissions:
  contents: read

concurrency:
  group: release-iso-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --verify-tag --title "rs2 $TAG" --generate-notes
          fi

  build:
    needs: release
    uses: ./.github/workflows/build-iso.yml
    with:
      ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rs2-live

      - name: Attach to the release
        run: gh release upload "$TAG" rs2-live.iso rs2-live.iso.sha256 --clobber
